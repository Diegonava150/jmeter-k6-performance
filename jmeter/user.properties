# JTL output format. tools/summarize.py locates fields by header name, so the only
# hard requirement is that the header row is written and these columns exist. The
# set below is otherwise kept lean: every extra column is disk I/O on the load
# generator during the measurement window, and response bodies in particular are
# a well known way to end up measuring your own disk instead of the service.
jmeter.save.saveservice.output_format=csv
jmeter.save.saveservice.print_field_names=true
jmeter.save.saveservice.timestamp_format=ms

jmeter.save.saveservice.time=true
jmeter.save.saveservice.latency=true
jmeter.save.saveservice.label=true
jmeter.save.saveservice.response_code=true
jmeter.save.saveservice.successful=true
jmeter.save.saveservice.thread_counts=true

# Response bodies are never needed and are expensive to keep.
jmeter.save.saveservice.response_data=false
jmeter.save.saveservice.response_data.on_error=false
jmeter.save.saveservice.samplerData=false
jmeter.save.saveservice.requestHeaders=false
jmeter.save.saveservice.responseHeaders=false
jmeter.save.saveservice.assertion_results_failure_message=false
jmeter.save.saveservice.url=false

# `bytes` is not used by tools/summarize.py, but JMeter's own HTML dashboard
# (`make report`) refuses to build without it. Kept for that reason alone.
jmeter.save.saveservice.bytes=true

summariser.interval=15
