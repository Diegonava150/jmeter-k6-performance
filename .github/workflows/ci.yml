name: cross-engine load

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Performance regressions arrive without a commit to blame, so the suite also
    # runs on its own once a week.
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything checkable without Docker or a load generator. Runs on its own so a
  # broken summarizer or a gate that no longer rejects bad runs fails in seconds
  # rather than behind six minutes of load testing.
  unit:
    name: Tests (summarizer + gate)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make test

  # The headline check: both engines, one workload, one gate.
  load:
    name: Cross-engine load
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-engines

      - name: Start hermetic stack
        run: make up

      - name: Run both engines and cross-verify
        run: make load

      - name: JMeter HTML report
        if: always()
        run: make report || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-evidence
          path: |
            reports/*.json
            reports/*.jtl
            reports/jmeter.log
            reports/html
          retention-days: 14

      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --tail 200

      - name: Tear down
        if: always()
        run: make down

  # Deliberately its own required check rather than a step inside the load job.
  # A green "Cross-engine load" only says the service met the SLO today; this one
  # says the SLO check is still capable of failing at all. Those are different
  # claims and the second is the one that rots silently, so it gets its own line
  # in the checks list.
  teeth:
    name: Prove the gate has teeth
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-engines

      - name: Start hermetic stack
        run: make up

      - name: Inject a real fault and require both engines to catch it
        run: make prove-teeth

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teeth-evidence
          path: reports/*.json
          retention-days: 14

      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --tail 200

      - name: Tear down
        if: always()
        run: make down

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks scans history, not just the tip

      - name: Install gitleaks
        run: |
          set -euo pipefail
          VERSION=8.30.1
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          tar xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/gitleaks" version

      - name: Scan
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --verbose --exit-code 1
